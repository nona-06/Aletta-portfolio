name: Deploy Flet App to Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      # FIX 1: Explicitly download the exact Flutter SDK version Flet is asking for
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'

      # FIX 2: Added a non-interactive flag so it compiles cleanly without asking for prompts
      - name: Build Flet Web App
        run: |
          flet build web --module-name tuni --base-url /Aletta-portfolio/

      - name: Upload Production Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  publish:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
